name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests
      - run: python -c "import portfolio_engine; assert hasattr(portfolio_engine, 'PortfolioAnalyticsEngine')"
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m ruff check src tests
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m mypy src/portfolio_intelligence

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build/cmake -DPORTFOLIO_ENGINE_BUILD_PYTHON=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cmake --parallel 2
      - run: ctest --test-dir build/cmake --output-on-failure
      - run: ./build/cmake/portfolio-engine-demo 1000

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: python -m pip install build check-wheel-contents twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m check_wheel_contents dist/*.whl
      - name: Clean wheel installation and CLI smoke test
        run: |
          python -m venv /tmp/portfolio-wheel-test
          /tmp/portfolio-wheel-test/bin/pip install dist/*.whl
          PORTFOLIO_INTELLIGENCE_HOME=/tmp/portfolio-demo /tmp/portfolio-wheel-test/bin/portfolio --help
          PORTFOLIO_INTELLIGENCE_HOME=/tmp/portfolio-demo /tmp/portfolio-wheel-test/bin/portfolio doctor
          PORTFOLIO_INTELLIGENCE_HOME=/tmp/portfolio-demo /tmp/portfolio-wheel-test/bin/portfolio summary --format json
          /tmp/portfolio-wheel-test/bin/python -c "import portfolio_engine, portfolio_intelligence; assert portfolio_intelligence.__version__ == '0.1.0'"
      - uses: actions/upload-artifact@v7
        with: {name: distributions, path: dist/*}

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flag: [PORTFOLIO_ENGINE_ENABLE_ASAN, PORTFOLIO_ENGINE_ENABLE_UBSAN]
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build/sanitizer -DPORTFOLIO_ENGINE_BUILD_PYTHON=OFF -D${{ matrix.flag }}=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/sanitizer --parallel 2
      - run: ctest --test-dir build/sanitizer --output-on-failure

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v3
