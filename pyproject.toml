[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "portfolio-intelligence"
version = "0.1.0"
description = "Open-source C++/Python portfolio analytics SDK and CLI for deterministic portfolio accounting and risk analytics."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sashank Tadimeti" }]
keywords = ["portfolio", "risk", "quantitative-finance", "analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "Jinja2>=3.1",
  "numpy>=1.26",
  "pandas>=2.0",
  "platformdirs>=4.0",
  "plotly>=5.20",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "rich>=13.7",
  "SQLAlchemy>=2.0",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/stadimeti19/portfolio-intelligence-engine"
Documentation = "https://github.com/stadimeti19/portfolio-intelligence-engine#readme"
Issues = "https://github.com/stadimeti19/portfolio-intelligence-engine/issues"
Source = "https://github.com/stadimeti19/portfolio-intelligence-engine"

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.35",
]
ai = [
  "openai>=2.37.0",
]
dev = [
  "build>=1.2",
  "check-wheel-contents>=0.6",
  "mypy>=1.10",
  "pybind11>=2.12",
  "pytest>=8.0",
  "ruff>=0.5",
  "twine>=5.1",
]

[project.scripts]
portfolio = "portfolio_intelligence.cli.main:app"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/portfolio_intelligence"]
cmake.version = ">=3.20"
sdist.include = [
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "RELEASE_NOTES.md",
  "SECURITY.md",
]
sdist.exclude = [
  ".env*",
  "!.env.example",
  ".venv",
  "**/__pycache__",
  "**/*.py[cod]",
  "build",
  "dist",
  "reports",
  "logs",
  "cache",
  "**/*.db",
  "**/*.sqlite*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]

[tool.mypy]
python_version = "3.11"
packages = ["portfolio_intelligence"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
